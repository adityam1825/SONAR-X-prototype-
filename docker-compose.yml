version: '3.9'

services:
  # ── PostgreSQL ──────────────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: sonarx_postgres
    environment:
      POSTGRES_DB: sonarx_db
      POSTGRES_USER: sonarx
      POSTGRES_PASSWORD: sonarx_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sonarx"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Django Backend ──────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sonarx_backend
    environment:
      DJANGO_SECRET_KEY: sonarx-dev-secret-change-in-production
      DEBUG: "True"
      DB_NAME: sonarx_db
      DB_USER: sonarx
      DB_PASSWORD: sonarx_password
      DB_HOST: postgres
      DB_PORT: "5432"
      JWT_SECRET: sonarx-jwt-secret-change-in-production
      MEDIA_ROOT: /app/media
      AI_MODEL_PATH: /app/ai/models/sonarx_yolo.pt
      DEMO_MODE: "true"
      YOLO_CONFIDENCE_THRESHOLD: "0.35"
      TEMPORAL_SEARCH_RADIUS: "500"
      FINGERPRINT_SIMILARITY_THRESHOLD: "0.65"
      CORS_ALLOWED_ORIGINS: "http://localhost:5173,http://localhost:3000,http://frontend:80"
      SONARX_VERSION: "0.1.0-prototype"
    volumes:
      - ./backend:/app
      - ./ai:/app/ai
      - ./demo_data:/app/demo_data
      - media_data:/app/media
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      sh -c "
        python manage.py migrate --noinput &&
        python manage.py seed_demo &&
        python manage.py collectstatic --noinput &&
        gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 2 --timeout 120
      "

  # ── React Frontend ──────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sonarx_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

  # ── Redis (optional — Celery support) ──────────────────────────
  # redis:
  #   image: redis:7-alpine
  #   container_name: sonarx_redis
  #   ports:
  #     - "6379:6379"

volumes:
  postgres_data:
  media_data:
